[pytest]
testpaths = tests
pythonpath = .
# Кэш pytest в этом окружении создать нельзя (каталог в корне проекта недоступен
# процессу), а проекту он не нужен: отключаем, чтобы не было ложных предупреждений.
addopts = -q -p no:cacheprovider -m "not live"
asyncio_mode = auto
markers =
    live: реальные запросы к источникам (запуск: pytest -m live)
    live_tg: реальная отправка в Telegram (нужны TELEGRAM_BOT_TOKEN и TG_CHAT_ID)
